<title>SCS-C03 問題集</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: 1 column study surface (max 760px) + a side chat that docks right on wide screens and becomes a full sheet on phones */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --sunken: #eef1f4;
  --fg: #16202a;
  --muted: #5a6673;
  --line: #dde2e8;
  --accent: #0a7a74;
  --accent-soft: #e2f3f1;
  --on-accent: #ffffff;
  --ok: #1d8a4b;
  --ok-soft: #e4f4ea;
  --ng: #c33a3a;
  --ng-soft: #fbe9e9;
  --flag: #b27511;
  --flag-soft: #fbf0dc;
  --code-bg: #f0f3f6;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
  --chat-w: 400px;
  --header-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --surface: #151c23; --sunken: #1b242c; --fg: #e5eaef; --muted: #93a0ad; --line: #26313b;
    --accent: #3cc2b8; --accent-soft: #143633; --on-accent: #062321;
    --ok: #4cc27f; --ok-soft: #13301f; --ng: #f06c6c; --ng-soft: #3a1a1a; --flag: #e3a63e; --flag-soft: #352914; --code-bg: #1b242c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #151c23; --sunken: #1b242c; --fg: #e5eaef; --muted: #93a0ad; --line: #26313b;
  --accent: #3cc2b8; --accent-soft: #143633; --on-accent: #062321;
  --ok: #4cc27f; --ok-soft: #13301f; --ng: #f06c6c; --ng-soft: #3a1a1a; --flag: #e3a63e; --flag-soft: #352914; --code-bg: #1b242c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, select:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { height: var(--header-h); display: flex; align-items: center; gap: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .02em; background: none; border: 0; padding: 4px 0; display: flex; align-items: center; gap: 8px; }
.brand .tag { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; line-height: 18px; }
.spacer { flex: 1; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync[data-s="on"] i { background: var(--ok); }
.sync[data-s="off"] i { background: var(--ng); }
.iconbtn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; }
.iconbtn:hover { background: var(--sunken); }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* main */
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 96px; transition: margin-right .2s ease; }
.main { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
@media (min-width: 1100px) {
  body.chat-open .wrap { margin-right: var(--chat-w); }
}
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.4; }
h2 { font-size: 15px; font-weight: 700; }
.label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

/* home */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat b small { font-size: 13px; color: var(--muted); margin-left: 2px; }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.starts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.start { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; text-align: left; display: grid; gap: 2px; min-width: 0; }
.start:hover:not(:disabled) { border-color: var(--accent); }
.start:disabled { opacity: .45; cursor: default; }
.start strong { font-weight: 500; }
.start span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.start.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.start.primary span { color: var(--on-accent); opacity: .8; }
.resume { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-color: var(--accent); }
.resume div { flex: 1; min-width: 0; }
.domain { padding: 14px 16px; display: grid; gap: 8px; }
.domain-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.domain-h h2 { flex: 1; min-width: 0; }
.domain-h .w { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; }
.task { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 7.5em 3.2em; align-items: center; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; background: none; border: 0; text-align: left; width: calc(100% + 16px); }
.task:hover { background: var(--sunken); }
.task .no { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.task .nm { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .acc { font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .b-ok { background: var(--ok); }
.bar .b-ng { background: var(--ng); }
@media (max-width: 520px) { .task { grid-template-columns: 2.6em minmax(0, 1fr) 3.2em; } .task .bar { display: none; } }
.history { padding: 12px 16px; display: grid; gap: 4px; }
.history-row { display: flex; gap: 12px; font-size: 13px; font-family: var(--font-mono); color: var(--muted); }
.history-row b { color: var(--fg); font-weight: 500; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* quiz */
.qbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qbar h1 { font-size: 15px; font-weight: 500; flex: 1; min-width: 0; }
.qbar .count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-size: 14px; line-height: 1.4; }
.btn:hover:not(:disabled) { background: var(--sunken); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 500; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.grid { display: flex; flex-wrap: wrap; gap: 4px; }
.grid button { width: 34px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 12px; position: relative; padding: 0; }
.grid button.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.grid button.ans { background: var(--sunken); }
.grid button.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.grid button.ng { background: var(--ng-soft); border-color: var(--ng); color: var(--ng); }
.grid button.flag::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--flag); }
.card { padding: 18px 20px; display: grid; gap: 16px; }
@media (max-width: 520px) { .card { padding: 16px; } }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.meta .id { font-family: var(--font-mono); color: var(--fg); }
.chip { font-size: 11px; border-radius: 4px; padding: 0 6px; line-height: 20px; border: 1px solid var(--line); white-space: nowrap; }
.chip.ai { color: var(--accent); border-color: var(--accent); }
.chip.multi { color: var(--flag); border-color: var(--flag); }
.meta .tools { margin-left: auto; display: flex; gap: 6px; }
.toggle { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--muted); }
.toggle svg { width: 14px; height: 14px; }
.toggle[aria-pressed="true"] { color: var(--flag); border-color: var(--flag); background: var(--flag-soft); }
.qtext { font-size: 15.5px; line-height: 1.85; overflow-wrap: anywhere; }
.qtext pre, .md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; margin: 8px 0; }
.qtext code, .md code { font-family: var(--font-mono); font-size: .9em; background: var(--code-bg); border-radius: 4px; padding: 0 4px; }
.qtext pre code, .md pre code { background: none; padding: 0; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--muted); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .key { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.opt.multi .key { border-radius: 50%; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt .txt { overflow-wrap: anywhere; }
.opt .note { grid-column: 2; font-size: 13.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; }
.opts.done .opt { cursor: default; }
.opts.done .opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opts.done .opt.right .key { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.opts.done .opt.wrong { border-color: var(--ng); background: var(--ng-soft); }
.opts.done .opt.wrong .key { background: var(--ng); border-color: var(--ng); color: var(--on-accent); }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.actions .spacer { flex: 1; }
.verdict { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.verdict.ok { color: var(--ok); }
.verdict.ng { color: var(--ng); }
.verdict small { font-weight: 400; font-size: 13px; color: var(--muted); }
.explain { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.explain p { margin: 0; }
.refs { display: grid; gap: 2px; font-size: 13px; }
.asks { display: flex; gap: 6px; flex-wrap: wrap; }
.ask { border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.ask:hover { background: var(--accent-soft); }
.ask:disabled { opacity: .5; cursor: default; }
.note-line { font-size: 13px; color: var(--muted); }

/* results */
.score { padding: 18px 20px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.score b { font-family: var(--font-mono); font-size: 40px; font-weight: 500; line-height: 1; }
.score .pct { font-family: var(--font-mono); font-size: 18px; color: var(--muted); }
.dbars { padding: 14px 16px; display: grid; gap: 10px; }
.dbar { display: grid; grid-template-columns: minmax(0, 1fr) 4.5em; gap: 4px 10px; align-items: center; font-size: 13px; }
.dbar .bar { grid-column: 1 / -1; height: 8px; }
.dbar .v { font-family: var(--font-mono); text-align: right; color: var(--muted); }

/* chat */
.chat { position: fixed; z-index: 25; background: var(--surface); display: flex; flex-direction: column; }
@media (min-width: 1100px) {
  .chat { top: calc(var(--header-h) + 1px + env(safe-area-inset-top, 0px)); right: 0; bottom: 0; width: var(--chat-w); border-left: 1px solid var(--line); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
}
@media (max-width: 1099.98px) {
  .chat { inset: 0; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
}
.chat-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.chat-h strong { flex: 1; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); font-size: 12px; padding: 3px 8px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.chat-ctx { font-size: 12px; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--sunken); display: flex; gap: 8px; align-items: center; }
.chat-ctx .mono { color: var(--fg); }
.msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 100%; min-width: 0; }
.msg.user { align-self: flex-end; background: var(--accent-soft); border-radius: 12px 12px 2px 12px; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 88%; }
.msg.assistant { font-size: 14.5px; }
.msg .ctx { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: block; }
.msg.thinking { color: var(--muted); font-size: 13px; }
.msg.err { color: var(--ng); font-size: 13px; }
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0 0 .7em; }
.md ul, .md ol { padding-left: 1.3em; }
.md h1, .md h2, .md h3, .md h4 { font-size: 14.5px; margin: 1em 0 .4em; }
.md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; margin: 0 0 .8em; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--sunken); }
.chat-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px 0; }
.chat-chips .ask { white-space: nowrap; }
.composer { display: flex; gap: 6px; align-items: flex-end; padding: 10px 12px 12px; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); font: inherit; font-size: 14.5px; line-height: 1.5; padding: 8px 10px; max-height: 160px; }
.composer .iconbtn { flex: none; }
.mic[data-state="listening"] { color: var(--ng); border-color: var(--ng); background: var(--ng-soft); }
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 22; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); padding: 12px 18px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.fab svg { width: 18px; height: 18px; }
@media (min-width: 1100px) { .fab { display: none; } }
@media (max-width: 1099.98px) { .only-wide { display: none !important; } }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); font-size: 13px; padding: 8px 14px; border-radius: 8px; z-index: 40; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-in">
    <button class="brand" id="home-btn" type="button" aria-label="ホームへ"><span>SCS 問題集</span><span class="tag">C03</span></button>
    <div class="spacer"></div>
    <span class="sync" id="sync" data-s="wait" aria-live="polite"><i></i><span id="sync-t">接続中</span></span>
    <button class="iconbtn" id="theme-btn" type="button" aria-label="ライトモードとダークモードを切り替える"></button>
    <button class="iconbtn only-wide" id="chat-btn" type="button" aria-label="Claude に聞く" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    </button>
  </div>
</header>

<div class="wrap"><main class="main" id="main"></main></div>

<button class="fab" id="fab" type="button" aria-label="Claude に聞く">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  <span>Claude</span>
</button>

<aside class="chat" id="chat" hidden aria-label="Claude に質問">
  <div class="chat-h">
    <strong>Claude</strong>
    <div class="seg" id="tier" role="group" aria-label="回答の深さ">
      <button type="button" data-t="quick" aria-label="速く答える">速い</button>
      <button type="button" data-t="default" aria-label="標準">標準</button>
      <button type="button" data-t="complex" aria-label="じっくり考えて答える">深い</button>
    </div>
    <button class="iconbtn" id="chat-clear" type="button" aria-label="会話を消す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
    </button>
    <button class="iconbtn" id="chat-close" type="button" aria-label="閉じる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="chat-ctx" id="chat-ctx"></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="chat-chips" id="chat-chips"></div>
  <form class="composer" id="composer">
    <textarea id="chat-in" rows="1" placeholder="質問" aria-label="Claude への質問"></textarea>
    <button class="iconbtn mic" id="mic" type="button" aria-label="音声で入力" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="iconbtn" id="send" type="submit" aria-label="送信">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</aside>

<script id="qdata" type="application/json">__QUESTIONS__</script>
<script>
"use strict";
/* ---------- static data ---------- */
const DOMAINS = {

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const getQ = id => BMAP[id] || aiQs[id];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sameSet = (a, b) => a.length === b.length && [...a].sort().join() === [...b].sort().join();
const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

/* ---------- storage (db) ---------- */
function setSync(s, text) { $("#sync").dataset.s = s; $("#sync-t").textContent = text; }
const queue = {}, inflight = {};
function save(id, data) {
  if (!coll || !writable) return;
  queue[id] = { data };
  if (!inflight[id]) flush(id);
}
function remove(id) {
  if (!coll || !writable) return;
  queue[id] = { del: true };
  if (!inflight[id]) flush(id);
}
async function flush(id) {
  inflight[id] = true;
  while (queue[id]) {
    const job = queue[id]; delete queue[id];
    try { job.del ? await coll.doc(id).delete() : await coll.doc(id).set(job.data); }
    catch (e) {
      if (e && e.code === "invalid_argument") { writable = false; setSync("off", "保存不可"); }
      else if (e && e.code === "quota_exceeded") toast("保存できる量の上限に達しました");
      else if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); try { job.del ? await coll.doc(id).delete() : await coll.doc(id).set(job.data); } catch (e2) {} }
    }
  }
  inflight[id] = false;
}
function applySnap(snap) {
  const p = {}, ai = {}, ex = [];
  let c = null, rs = null;
  for (const d of snap.docs) {
    const v = d.data(); if (!v) continue;
    if (d.id.startsWith("p_")) p[d.id.slice(2)] = v;
    else if (d.id.startsWith("ai_") && v.q) ai[v.q.id] = v.q;
    else if (d.id.startsWith("exam_")) ex.push(v);
    else if (d.id === "chat") c = v.messages || [];
    else if (d.id === "session") rs = v.ids ? v : null;
  }
  progress = p; aiQs = ai; exams = ex.sort((a, b) => b.at - a.at); remoteSession = rs;
  if (!streaming && c) { chat = c.slice(); renderChat(); }
  if (view === "home") renderHome();
  else if (view === "quiz") { renderGrid(); paintFlags(); }
}
async function initStore() {
  const C = window.claude;
  if (!C || !C.use) { setSync("off", "保存なし"); renderHome(); return; }
  const [user, db] = await Promise.all([C.use("user"), C.use("db")]);
  if (!user || !db) { setSync("off", "保存なし"); renderHome(); return; }
  const uid = await user.id();
  if (!uid) { setSync("off", "保存なし"); renderHome(); return; }
  coll = db.collection("data/users/" + uid);
  const timer = setTimeout(() => setSync("wait", "応答待ち"), 10000);
  coll.onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync("on", "同期済み"); }
    applySnap(snap);
  }, err => { clearTimeout(timer); setSync("off", "同期停止"); });
}

/* ---------- progress helpers ---------- */
function prog(id) { return progress[id] || { attempts: 0, correct: 0 }; }
function record(id, choice, ok) {
  const p = { ...prog(id) };
  p.qid = id; p.attempts = (p.attempts || 0) + 1; p.correct = (p.correct || 0) + (ok ? 1 : 0);
  p.last = ok; p.lastChoice = choice; p.lastAt = Date.now();
  p.hist = [...(p.hist || []).slice(-9), ok ? 1 : 0];
  progress[id] = p; save("p_" + id, p);
}
function toggleFlag(id, key) {
  const p = { ...prog(id), qid: id }; p[key] = !p[key];
  progress[id] = p; save("p_" + id, p);
}
function bankStats(ids = BANK.map(q => q.id)) {
  let answered = 0, ok = 0, ng = 0;
  for (const id of ids) { const p = progress[id]; if (p && p.attempts) { answered++; p.last ? ok++ : ng++; } }
  return { total: ids.length, answered, ok, ng, acc: answered ? Math.round(ok / answered * 100) : null };
}
const idsBy = f => BANK.filter(f).map(q => q.id);
const wrongIds = () => idsBy(q => progress[q.id] && progress[q.id].attempts && progress[q.id].last === false);
const bmIds = () => [...idsBy(q => progress[q.id] && progress[q.id].bm), ...Object.keys(aiQs).filter(id => progress[id] && progress[id].bm)];
const laterIds = () => [...idsBy(q => progress[q.id] && progress[q.id].later), ...Object.keys(aiQs).filter(id => progress[id] && progress[id].later)];
const newIds = () => idsBy(q => !progress[q.id] || !progress[q.id].attempts);
const weakIds = () => BANK.filter(q => { const p = progress[q.id]; return p && p.attempts && (p.correct / p.attempts) < 0.6; })
  .sort((a, b) => (progress[a.id].correct / progress[a.id].attempts) - (progress[b.id].correct / progress[b.id].attempts)).map(q => q.id);

function examIds() {
  const out = [];
  const ds = Object.keys(DOMAINS).map(Number);
  let quota = ds.map(d => ({ d, n: Math.round(EXAM_SIZE * DOMAINS[d].weight / 100) }));
  let sum = quota.reduce((s, x) => s + x.n, 0);
  while (sum > EXAM_SIZE) { quota.sort((a, b) => b.n - a.n)[0].n--; sum--; }
  while (sum < EXAM_SIZE) { quota.sort((a, b) => DOMAINS[b.d].weight - DOMAINS[a.d].weight)[0].n++; sum++; }
  for (const { d, n } of quota) out.push(...shuffle(idsBy(q => q.domain === d)).slice(0, n));
  return shuffle(out);
}

/* ---------- sessions ---------- */
function startSession(ids, title, mode = "practice") {
  ids = ids.filter(getQ);
  if (!ids.length) { toast("対象の問題がありません"); return; }
  session = { mode, title, ids, idx: 0, answers: {}, startedAt: Date.now() };
  persistSession();
  view = "quiz"; renderQuiz();
}
function persistSession() {
  if (!session) { remove("session"); return; }
  save("session", { ...session, savedAt: Date.now() });
}
function resume(s) { session = JSON.parse(JSON.stringify(s)); delete session.savedAt; view = "quiz"; renderQuiz(); }
function goHome() { view = "home"; renderHome(); refreshChatCtx(); window.scrollTo(0, 0); }
$("#home-btn").onclick = goHome;

/* ---------- rich text ---------- */
function rich(text) {
  const parts = String(text ?? "").split(/```(\w*)\n?([\s\S]*?)```/g);
  let html = "";
  for (let i = 0; i < parts.length; i += 3) {
    html += esc(parts[i]).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
    if (i + 2 < parts.length) html += `<pre><code>${esc(parts[i + 2].replace(/\n$/, ""))}</code></pre>`;
  }
  return html;
}
function md(text) {
  if (window.marked && window.DOMPurify) {
    const html = marked.parse(String(text ?? ""), { gfm: true, breaks: true });
    return DOMPurify.sanitize(html, { ADD_ATTR: ["target"] });
  }
  return rich(text);
}
if (window.DOMPurify) DOMPurify.addHook("afterSanitizeAttributes", n => { if (n.tagName === "A") { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener"); } });

/* ---------- home ---------- */
function renderHome() {
  if (view !== "home") return;
  const s = bankStats();
  const w = wrongIds().length, b = bmIds().length, l = laterIds().length, n = newIds().length, a = Object.keys(aiQs).length, wk = weakIds().length;

    <button class="start" data-start="exam" type="button"><strong>模擬試験</strong><span>${Math.min(EXAM_SIZE, BANK.length)}問</span></button>
    <button class="start" data-start="wrong" type="button" ${w ? "" : "disabled"}><strong>間違えた問題</strong><span>${w}問</span></button>
    <button class="start" data-start="weak" type="button" ${wk ? "" : "disabled"}><strong>苦手な問題</strong><span>${wk}問</span></button>
    <button class="start" data-start="bm" type="button" ${b ? "" : "disabled"}><strong>ブックマーク</strong><span>${b}問</span></button>
    <button class="start" data-start="later" type="button" ${l ? "" : "disabled"}><strong>後で確認</strong><span>${l}問</span></button>
    <button class="start" data-start="new" type="button" ${n ? "" : "disabled"}><strong>未回答</strong><span>${n}問</span></button>
    <button class="start" data-start="ai" type="button" ${a ? "" : "disabled"}><strong>AI 類題</strong><span>${a}問</span></button>
  </section>`;
  html += `<div class="row"><button class="ask" id="analyze" type="button" ${sampleFn ? "" : "hidden"}>弱点を分析</button><button class="ask" id="plan" type="button" ${sampleFn ? "" : "hidden"}>今日の学習メニュー</button></div>`;
  for (const [d, dom] of Object.entries(DOMAINS)) {
    const ds = bankStats(idsBy(q => q.domain === +d));
    html += `<section class="panel domain"><div class="domain-h"><h2>分野${d} ${esc(dom.name)}</h2><span class="w">${dom.weight}%</span><button class="linkbtn" data-domain="${d}" type="button" ${ds.total ? "" : "disabled"}>${ds.total}問を解く</button></div>`;
    for (const [t, name] of Object.entries(dom.tasks)) {
      const ts = bankStats(idsBy(q => q.task === t));
      const okw = ts.total ? ts.ok / ts.total * 100 : 0, ngw = ts.total ? ts.ng / ts.total * 100 : 0;
      html += `<button class="task" data-task="${t}" type="button" ${ts.total ? "" : "disabled"} aria-label="タスク${t} ${esc(name)} ${ts.total}問">
        <span class="no">${t}</span><span class="nm">${esc(name)}</span>
        <span class="bar" aria-hidden="true"><i class="b-ok" style="width:${okw}%"></i><i class="b-ng" style="width:${ngw}%"></i></span>
        <span class="acc">${ts.answered}/${ts.total}</span></button>`;
    }
    html += `</section>`;
  }
  if (exams.length) {
    html += `<section class="panel history"><h2>模擬試験の記録</h2>${exams.slice(0, 8).map(e => `<div class="history-row"><span>${fmtDate(e.at)}</span><b>${e.correct} / ${e.total}</b><span>${Math.round(e.correct / e.total * 100)}%</span></div>`).join("")}</section>`;

    const k = b.dataset.start;

  main.querySelectorAll("[data-domain]").forEach(b => b.onclick = () => startSession(idsBy(q => q.domain === +b.dataset.domain), `分野${b.dataset.domain} ${DOMAINS[b.dataset.domain].name}`));

  const rd = $("#resume-drop"); if (rd) rd.onclick = () => { session = null; remoteSession = null; remove("session"); renderHome(); };
  const an = $("#analyze"); if (an) an.onclick = () => { openChat(); sendChat("回答履歴から私の弱点を分析して、どの分野のどの論点を優先して復習すべきか教えてください。"); };
  const pl = $("#plan"); if (pl) pl.onclick = () => { openChat(); sendChat("回答履歴をもとに、今日30分でやる学習メニューを組んでください。解くべき問題はセットとして開いてください。"); };
}

/* ---------- quiz ---------- */
function curQ() { return session && getQ(session.ids[session.idx]); }
function curA() { const q = curQ(); if (!q) return null; return session.answers[q.id] || (session.answers[q.id] = { choice: [], done: false }); }
function renderQuiz() {
  const q = curQ();
  if (!q) { goHome(); return; }
  const a = curA();
  const exam = session.mode === "exam";
  const multi = q.type === "multi";
  const need = multi ? q.answer.length : 1;
  const dom = DOMAINS[q.domain] || { name: "", tasks: {} };
  const showResult = !exam && a.done;
  const p = prog(q.id);
  let html = `<div class="qbar"><button class="btn small" id="q-home" type="button">ホーム</button><h1>${esc(session.title)}</h1><span class="count">${session.idx + 1} / ${session.ids.length}</span>${exam ? `<button class="btn small primary" id="finish" type="button">採点</button>` : ""}</div>`;
  html += `<nav class="grid" id="grid" aria-label="問題の一覧"></nav>`;
  html += `<article class="panel card">
    <div class="meta"><span class="id">${esc(q.id)}</span><span>分野${q.domain} ${esc(dom.tasks[q.task] || dom.name)}</span>${q.ai ? '<span class="chip ai">AI</span>' : ""}${multi ? `<span class="chip multi">${need}つ選択</span>` : ""}
      <span class="tools">
        <button class="toggle" id="t-later" type="button" aria-pressed="${!!p.later}" aria-label="後で確認"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>後で</button>
        <button class="toggle" id="t-bm" type="button" aria-pressed="${!!p.bm}" aria-label="ブックマーク"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
        ${q.ai ? `<button class="toggle" id="t-del" type="button" aria-label="この AI 類題を削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>` : ""}
      </span></div>
    <div class="qtext">${rich(q.question)}</div>
    <div class="opts ${showResult ? "done" : ""}" role="${multi ? "group" : "radiogroup"}" aria-label="選択肢">`;
  q.options.forEach((o, i) => {
    const sel = a.choice.includes(i);
    let cls = "opt" + (multi ? " multi" : "") + (sel ? " sel" : "");
    if (showResult) { if (q.answer.includes(i)) cls += " right"; else if (sel) cls += " wrong"; }
    html += `<label class="${cls}" data-i="${i}"><input type="${multi ? "checkbox" : "radio"}" name="opt" ${sel ? "checked" : ""} ${showResult ? "disabled" : ""}><span class="key">${LETTERS[i]}</span><span class="txt">${rich(o)}</span>${showResult && q.optionNotes && q.optionNotes[i] ? `<span class="note">${rich(q.optionNotes[i])}</span>` : ""}</label>`;
  });
  html += `</div>`;
  if (showResult) {
    const ok = a.ok;
    html += `<div class="verdict ${ok ? "ok" : "ng"}">${ok ? "正解" : "不正解"}<small>正解は ${q.answer.map(i => LETTERS[i]).join(", ")}</small></div>`;
  }
  html += `<div class="actions">
    <button class="btn" id="prev" type="button" ${session.idx ? "" : "disabled"}>前へ</button>
    <div class="spacer"></div>
    ${exam || showResult ? "" : `<button class="btn primary" id="submit" type="button" ${a.choice.length === need ? "" : "disabled"}>回答する</button>`}
    ${exam || showResult ? `<button class="btn ${showResult ? "primary" : ""}" id="next" type="button">${session.idx === session.ids.length - 1 ? (exam ? "採点へ" : "ホームへ") : "次へ"}</button>` : ""}
  </div>`;
  if (showResult) {
    html += `<div class="explain"><h2>解説</h2><div>${rich(q.explanation)}</div>`;
    if (q.services && q.services.length) html += `<div class="note-line">${q.services.map(esc).join(" / ")}</div>`;
    if (q.refs && q.refs.length) html += `<div class="refs">${q.refs.map(r => `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title || r.url)}</a>`).join("")}</div>`;
    if (sampleFn) {
      const g = genState[q.id];
      html += `<div class="asks">
        <button class="ask" data-ask="why" type="button">なぜこの答え？</button>
        <button class="ask" data-ask="others" type="button">他の選択肢がだめな理由</button>
        <button class="ask" data-ask="compare" type="button">関連サービスの比較表</button>
        <button class="ask" data-ask="memo" type="button">覚え方</button>
        ${g && g !== "busy" ? `<button class="ask" id="gen-open" type="button">作った類題を解く</button>` : `<button class="ask" id="gen" type="button" ${g === "busy" ? "disabled" : ""}>${g === "busy" ? "類題を作成中…" : "類題を作る"}</button>`}
      </div>`;
    }
    html += `</div>`;
  }
  html += `</article>`;
  main.innerHTML = html;
  renderGrid();
  bindQuiz(q, a, need, multi, exam, showResult);
  refreshChatCtx();
}
function renderGrid() {
  const g = $("#grid"); if (!g || !session) return;
  const exam = session.mode === "exam";

    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
}
$("#composer").onsubmit = ev => {
  ev.preventDefault();
  if (streaming) { if (ctl) ctl.abort(); return; }
  const inp = $("#chat-in"); const v = inp.value; inp.value = ""; autosize(); sendChat(v);
};
const inp = $("#chat-in");
function autosize() { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 160) + "px"; }
inp.addEventListener("input", autosize);
inp.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("#composer").requestSubmit(); } });

/* ---------- dictation ---------- */
let partialBase = null;
function bindDictation(d) {
  dict = d; const mic = $("#mic"); mic.hidden = false;
  d.onState(({ state, reason }) => {
    mic.dataset.state = state;
    mic.setAttribute("aria-label", state === "idle" ? "音声で入力" : "音声入力を止める");
    if (state === "idle") { partialBase = null; if (reason === "not_granted" || reason === "unavailable") mic.hidden = true; }
  });
  d.onPartial(({ text }) => { if (partialBase == null) partialBase = inp.value; inp.value = partialBase + text; autosize(); });
  d.onFinal(({ text }) => { const base = partialBase != null ? partialBase : inp.value; inp.value = (base ? base + text : text.replace(/^\s+/, "")); partialBase = null; autosize(); });
  mic.onclick = () => {
    if (d.active()) { d.stop().catch(() => {}); return; }
    d.start().catch(e => { if (e && e.code === "not_granted") mic.hidden = true; else if (e && e.code !== "stopped" && e.code !== "dismissed") toast("音声入力を開始できませんでした"); });
  };
}

/* ---------- boot ---------- */
renderHome();
initStore();
(async () => {
  const C = window.claude; if (!C || !C.use) { renderChat(); return; }
  const s = await C.use("sample");
  if (s) {
    sampleFn = s;
    try { const lim = await s.limits(); toolsOK = !!lim.tools; } catch (e) { toolsOK = false; }
    if (view === "home") renderHome(); else if (view === "quiz") renderQuiz(); else if (view === "result") renderResult();
  }
  renderChat(); refreshChatCtx();
  const d = await C.use("dictation"); if (d) bindDictation(d);
})();
</script>
